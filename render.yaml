# Render.com Blueprint - AI Proxy Server
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: wizzy-ai-proxy
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL
        value: amazon.nova-lite-v1:0
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
